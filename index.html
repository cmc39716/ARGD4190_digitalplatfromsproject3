
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dynamic Optical Pattern | Creative Coding</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */

    .creative-coding-header {
      width: 100%;
      min-height: 105px;
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      border-bottom: 1px solid #d9d9d9;
      background: #f7f7f5;
    }

    .creative-coding-logo {
      color: #111;
      text-decoration: none;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .creative-coding-nav {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .creative-nav-link {
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      transition: color 0.2s ease;
    }

    .creative-nav-link:hover,
    .creative-nav-link.active {
      color: #d71920;
    }

    /* PATTERN */

    .optical-pattern-page {
      width: 100%;
      padding: 55px 20px 90px;
      display: flex;
      justify-content: center;
    }

    #pattern-container {
      width: 100%;
      max-width: 800px;
    }

    #pattern-container canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      box-shadow: 0 15px 50px rgba(0,0,0,0.08);
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .creative-coding-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 25px 6%;
        gap: 20px;
      }

      .creative-coding-logo {
        font-size: 22px;
      }

      .creative-coding-nav {
        gap: 20px;
        flex-wrap: wrap;
      }

      .creative-nav-link {
        font-size: 11px;
      }

      .optical-pattern-page {
        padding: 30px 12px 60px;
      }
    }
  </style>
</head>

<body>

  <!-- WEBSITE HEADER -->

  <header class="creative-coding-header">

    <a href="index.html" class="creative-coding-logo">
      CREATIVE CODING
    </a>

    <nav class="creative-coding-nav">

      <a href="index.html"
         class="creative-nav-link active">
        OPTICAL PATTERN
      </a>

      <a href="selfportrait.html"
         class="creative-nav-link">
        SELF PORTRAIT
      </a>

      <a href="Generativedesign.html"
         class="creative-nav-link">
        GENERATIVE DESIGN
      </a>

    </nav>

  </header>

  <!-- OPTICAL PATTERN -->

  <main class="optical-pattern-page">
    <div id="pattern-container"></div>
  </main>

  <!-- P5.JS SKETCH -->

  <script>

    let gridSize = 100;
    let cols, rows;
    let tiles = [];
    let smileys = [];

    let pushRadius = 180;
    let pushStrength = 75;
    let numberOfSmileys = 18;

    function setup() {
      let canvas = createCanvas(800, 800);
      canvas.parent("pattern-container");

      cols = int(width / gridSize);
      rows = int(height / gridSize);

      // Create the grid
      for (let i = 0; i < cols; i++) {
        tiles[i] = [];

        for (let j = 0; j < rows; j++) {
          tiles[i][j] = {
            x: i * gridSize + gridSize / 2,
            y: j * gridSize + gridSize / 2,
            offsetX: 0,
            offsetY: 0,
            rotation: (i + j) % 2 === 0
              ? 0 : HALF_PI
          };
        }
      }

      // Create floating smiley faces
      for (let i = 0; i < numberOfSmileys; i++) {
        smileys.push({
          x: random(width),
          y: random(height),
          size: random(25, 60),
          speedX: random(-0.6, 0.6),
          speedY: random(-0.4, 0.4),
          phase: random(TWO_PI),
          color: i % 2 === 0
            ? "#111111" : "#FFFFFF"
        });
      }
    }

    function draw() {
      background("#f7f7f5");

      let mouseInside =
        mouseX >= 0 && mouseX <= width &&
        mouseY >= 0 && mouseY <= height;

      // Draw animated pattern
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {

          let tile = tiles[i][j];

          let d = dist(
            mouseX, mouseY,
            tile.x, tile.y
          );

          let targetX = 0;
          let targetY = 0;

          let beingTouched =
            mouseInside && d < pushRadius;

          if (beingTouched) {
            let angle = atan2(
              tile.y - mouseY,
              tile.x - mouseX
            );

            let force = map(
              d, 0, pushRadius,
              pushStrength, 0
            );

            targetX = cos(angle) * force;
            targetY = sin(angle) * force;

          } else {
            let direction =
              (i + j) % 2 === 0 ? 1 : -1;

            tile.rotation += 0.008 * direction;
          }

          tile.offsetX = lerp(
            tile.offsetX, targetX, 0.12
          );

          tile.offsetY = lerp(
            tile.offsetY, targetY, 0.12
          );

          push();

          translate(
            tile.x + tile.offsetX,
            tile.y + tile.offsetY
          );

          rotate(tile.rotation);

          let arcColor;

          if ((i + j) % 2 === 0) {
            arcColor = "#D71920";
          } else {
            arcColor = "#111111";
          }

          let pulse = map(
            sin(frameCount * 0.02 + i + j),
            -1, 1,
            0.95, 1.05
          );

          scale(pulse);

          noFill();
          stroke(arcColor);
          strokeWeight(5);

          translate(
            -gridSize / 2,
            -gridSize / 2
          );

          // Draw nested quarter-circle arcs
          for (let r = 10; r <= gridSize; r += 10) {
            arc(
              0, 0,
              r * 2, r * 2,
              0, HALF_PI
            );
          }

          pop();
        }
      }

      // Floating smiley faces
      for (let smiley of smileys) {

        smiley.x += smiley.speedX;
        smiley.y += smiley.speedY;

        let bob = sin(
          frameCount * 0.025 + smiley.phase
        ) * 8;

        if (smiley.x < -smiley.size) {
          smiley.x = width + smiley.size;
        }

        if (smiley.x > width + smiley.size) {
          smiley.x = -smiley.size;
        }

        if (smiley.y < -smiley.size) {
          smiley.y = height + smiley.size;
        }

        if (smiley.y > height + smiley.size) {
          smiley.y = -smiley.size;
        }

        push();

        translate(smiley.x, smiley.y + bob);

        rotate(
          sin(frameCount * 0.01 + smiley.phase) * 0.2
        );

        drawSmiley(smiley.size, smiley.color);

        pop();
      }
    }

    function drawSmiley(size, faceColor) {

      let isBlack = faceColor === "#111111";

      stroke(isBlack ? "#FFFFFF" : "#111111");
      strokeWeight(2);
      fill(faceColor);

      circle(0, 0, size);

      // Eyes
      noStroke();
      fill(isBlack ? "#FFFFFF" : "#111111");

      circle(
        -size * 0.17,
        -size * 0.12,
        size * 0.09
      );

      circle(
        size * 0.17,
        -size * 0.12,
        size * 0.09
      );

      // Smile
      noFill();
      stroke(isBlack ? "#FFFFFF" : "#111111");
      strokeWeight(size * 0.055);
      strokeCap(ROUND);

      arc(
        0,
        size * 0.02,
        size * 0.5,
        size * 0.4,
        0,
        PI
      );
    }

    // Press S to save the design
    function keyPressed() {
      if (key === "s" || key === "S") {
        saveCanvas(
          "dynamic-optical-pattern",
          "png"
        );
      }
    }

  </script>

</body>
</html>
